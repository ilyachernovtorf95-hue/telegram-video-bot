name: Telegram Bot CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m py_compile bot.py local_ai.py gemini_ai.py sitecustomize.py yt_dlp_plugins/extractor/vk_channel.py

      - name: Check imports and VK channel URL routing
        run: |
          python -c "import requests, yt_dlp; print('Python dependencies OK')"
          python -c "from yt_dlp_plugins.extractor.vk_channel import VKChannelPostIE; assert VKChannelPostIE.suitable('https://vk.ru/im/channels/-230766877?cmid=10315'); assert VKChannelPostIE.suitable('https://vk.com/im/channels/-230766877?cmid=10315'); print('VK channel extractor routing OK')"

      - name: Build production Docker image
        run: docker build --progress=plain -t telegram-video-bot:ci .
