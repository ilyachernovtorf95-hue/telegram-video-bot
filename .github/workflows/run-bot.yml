name: Run Telegram Bot (disabled - Railway hosts production)

# The production bot runs continuously on Railway.
# This workflow intentionally does not start bot.py, because a second
# long-polling process using the same Telegram token causes HTTP 409 conflicts.

on:
  workflow_dispatch:

jobs:
  info:
    runs-on: ubuntu-latest
    steps:
      - name: Railway is the production runtime
        run: echo "Bot runtime is hosted on Railway; GitHub Actions runner is disabled to prevent duplicate Telegram polling."
