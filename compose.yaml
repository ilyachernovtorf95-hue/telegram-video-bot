services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: video-knowledge-bot:oci-arm64
    platform: linux/arm64
    env_file:
      - .env
    restart: unless-stopped
    init: true
    stop_grace_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

